<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HomeLab - Dynamic Server Monitoring and Management Dashboard">

    <title>HomeLab Dashboard</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/shell.css">

    <link id="page-stylesheet" rel="stylesheet" href="">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">
                    <i data-lucide="server"></i>
                </div>
                <div>
                    <div class="brand-name">HomeLab</div>
                    <div class="brand-subtitle">Server Control</div>
                </div>
            </div>

            <div class="nav-title">Overview</div>

            <nav class="nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#storage" class="nav-item" data-page="storage" id="nav-storage">
                    <i data-lucide="hard-drive"></i>
                    <span>Storage</span>
                </a>

                <a href="#network" class="nav-item" data-page="network" id="nav-network">
                    <i data-lucide="network"></i>
                    <span>Network</span>
                </a>

                <a href="#processes" class="nav-item" data-page="processes" id="nav-processes">
                    <i data-lucide="cpu"></i>
                    <span>Processes</span>
                </a>
            </nav>

            <div class="nav-title">Management</div>

            <nav class="nav">
                <a href="#services" class="nav-item" data-page="services" id="nav-services">
                    <i data-lucide="activity"></i>
                    <span>Services</span>
                </a>

                <a href="#containers" class="nav-item" data-page="containers" id="nav-containers">
                    <i data-lucide="container"></i>
                    <span>Containers</span>
                </a>

                <a href="#devices" class="nav-item" data-page="devices" id="nav-devices">
                    <i data-lucide="monitor-smartphone"></i>
                    <span>Devices</span>
                </a>

                <a href="#logs" class="nav-item" data-page="logs" id="nav-logs">
                    <i data-lucide="file-text"></i>
                    <span>Logs</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="server-status">
                    <div class="server-status-title">SERVER STATUS</div>
                    <div class="status-row">
                        <div class="shell-status-dot"></div>
                        <span>System Online</span>
                    </div>
                </div>
            </div>

        </aside>

        <main class="main" id="main-content">
            <div id="page-content" class="page-container">
            </div>
        </main>

    </div>

    <script src="js/router.js"></script>

</body>

</html>
